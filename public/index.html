<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colaê - Bate-Papo & Encontros Real-Time</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .neon-text {
      color: #39FF14;
      text-shadow: 0 0 8px rgba(57, 255, 20, 0.6), 0 0 20px rgba(57, 255, 20, 0.3);
    }
    .neon-bg {
      background-color: #39FF14;
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.5);
    }
  </style>
</head>
<body class="bg-black text-white font-sans min-h-screen flex flex-col justify-between selection:bg-[#39FF14] selection:text-black">

  <!-- MODAL DE AUTENTICAÇÃO -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-black flex flex-col justify-center items-center p-6 overflow-y-auto">
    <div class="w-full max-w-sm flex flex-col items-center space-y-5 my-auto">
      <div class="text-center space-y-2">
        <h1 class="text-5xl font-black tracking-wider neon-text lowercase">colaê</h1>
        <p class="text-xs text-zinc-400">Sistema de Teste de Clique Ativo</p>
      </div>

      <div class="flex w-full bg-zinc-900 rounded-xl p-1 border border-zinc-800 text-xs font-bold">
        <button id="tab-btn-cadastro" type="button" onclick="alternarAba('cadastro')" class="flex-1 py-2.5 rounded-lg bg-[#39FF14] text-black transition font-bold cursor-pointer">Criar Conta</button>
        <button id="tab-btn-login" type="button" onclick="alternarAba('login')" class="flex-1 py-2.5 rounded-lg text-zinc-400 hover:text-white transition font-bold cursor-pointer">Já tenho conta</button>
      </div>

      <!-- FORMULÁRIO CADASTRO -->
      <div id="box-cadastro" class="w-full space-y-3">
        <div>
          <label class="text-xs text-zinc-400 font-medium block mb-1">Nome</label>
          <input type="text" id="cad-nome" placeholder="Seu nome" class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#39FF14]">
        </div>
        <div>
          <label class="text-xs text-zinc-400 font-medium block mb-1">E-mail</label>
          <input type="email" id="cad-email" placeholder="seu@email.com" class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#39FF14]">
        </div>
        <div>
          <label class="text-xs text-zinc-400 font-medium block mb-1">Nickname</label>
          <input type="text" id="cad-nick" placeholder="@apelido" class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#39FF14]">
        </div>
        <div>
          <label class="text-xs text-zinc-400 font-medium block mb-1">Senha</label>
          <input type="password" id="cad-senha" placeholder="Senha" class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#39FF14]">
        </div>
        <button type="button" onclick="testarCliqueCadastro()" class="w-full neon-bg text-black font-bold py-3.5 rounded-xl text-sm transition hover:opacity-90 cursor-pointer">
          Cadastrar no Colaê
        </button>
      </div>

      <!-- FORMULÁRIO LOGIN -->
      <div id="box-login" class="w-full space-y-3 hidden">
        <div>
          <label class="text-xs text-zinc-400 font-medium block mb-1">Nickname</label>
          <input type="text" id="login-nick" placeholder="@apelido" class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#39FF14]">
        </div>
        <div>
          <label class="text-xs text-zinc-400 font-medium block mb-1">Senha</label>
          <input type="password" id="login-senha" placeholder="Senha" class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#39FF14]">
        </div>
        <button type="button" onclick="testarCliqueLogin()" class="w-full neon-bg text-black font-bold py-3.5 rounded-xl text-sm transition hover:opacity-90 cursor-pointer">
          Entrar na Conta
        </button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function alternarAba(aba) {
      alert("Aba trocada para: " + aba);
      document.getElementById('box-cadastro').classList.toggle('hidden', aba !== 'cadastro');
      document.getElementById('box-login').classList.toggle('hidden', aba !== 'login');
      
      document.getElementById('tab-btn-cadastro').className = aba === 'cadastro' 
        ? "flex-1 py-2.5 rounded-lg bg-[#39FF14] text-black transition font-bold cursor-pointer" 
        : "flex-1 py-2.5 rounded-lg text-zinc-400 hover:text-white transition font-bold cursor-pointer";
        
      document.getElementById('tab-btn-login').className = aba === 'login' 
        ? "flex-1 py-2.5 rounded-lg bg-[#39FF14] text-black transition font-bold cursor-pointer" 
        : "flex-1 py-2.5 rounded-lg text-zinc-400 hover:text-white transition font-bold cursor-pointer";
    }

    function testarCliqueCadastro() {
      const nome = document.getElementById('cad-nome').value;
      alert("Botão Cadastrar clicado com sucesso! Nome digitado: " + (nome || "(vazio)"));
      
      socket.emit('solicitar-cadastro', {
        nome: nome,
        email: document.getElementById('cad-email').value,
        nick: document.getElementById('cad-nick').value,
        senha: document.getElementById('cad-senha').value,
        foto: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80"
      });
    }

    function testarCliqueLogin() {
      const nick = document.getElementById('login-nick').value;
      alert("Botão Entrar clicado com sucesso! Nick digitado: " + (nick || "(vazio)"));
      
      socket.emit('solicitar-login', {
        nick: nick,
        senha: document.getElementById('login-senha').value
      });
    }

    socket.on('resposta-cadastro', (res) => {
      alert("Resposta do servidor (Cadastro): " + JSON.stringify(res));
      if (res.sucesso) {
        document.getElementById('login-modal').classList.add('hidden');
      }
    });

    socket.on('resposta-login', (res) => {
      alert("Resposta do servidor (Login): " + JSON.stringify(res));
      if (res.sucesso) {
        document.getElementById('login-modal').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
